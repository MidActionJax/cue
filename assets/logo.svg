<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232c42"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#b9cdff"/>
      <stop offset="0.55" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#5f7fe6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4cd97b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4cd97b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- glass tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sheen)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
  <!-- the C: a 270° arc opening to the right -->
  <path d="M 348.4 163.6 A 131 131 0 1 0 348.4 348.4" fill="none" stroke="url(#arc)" stroke-width="58" stroke-linecap="round"/>
  <!-- the cue light: "you're on" -->
  <circle cx="352" cy="256" r="80" fill="url(#glow)"/>
  <circle cx="352" cy="256" r="31" fill="#4cd97b"/>
  <circle cx="343" cy="246" r="10" fill="#ffffff" fill-opacity="0.45"/>
</svg>
