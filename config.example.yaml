# Cue configuration. Everything tunable lives here; restart the app after editing.
# (First run copies this file to config.yaml, which is yours and stays out of git.)

user:
  name: Alex
  # Whisper mis-hears names, especially from accented speakers. Any of these in what
  # someone says counts as "you're being addressed" for the `name` trigger.
  aliases: [Alex, Alec, Alexa, Aleks]
  # People on your calls. A question that names one of them ("Sam, do you know…") is theirs,
  # so the smart trigger won't pop up for it. Add names as you learn them.
  teammates: []               # e.g. [Sam, Priya, Marco]

# On launch the panel asks "Work or Interview?". Set ask_mode_on_start: false to go straight
# into `mode` instead.
ask_mode_on_start: true
mode: work

modes:
  interview:
    # auto   = answer every question the other side asks (1-on-1)
    # smart  = when your name is said, or the local model judges a question is meant for you
    # name   = only when your name is said (group calls)
    # manual = only when you press the answer hotkey
    trigger: auto
    # Files or folders (every .md/.txt/.pdf/.docx inside) injected as background context.
    context:
      - profiles/me.md
      - profiles/voice.md         # learned from your calls: how you actually talk (all modes)
      - profiles/interview/       # incl. learned.md: facts and habits from your interviews
      - profiles/work/all_time.md
  work:
    trigger: smart
    context:
      - profiles/me.md
      - profiles/voice.md
      - profiles/work/notes.md
      - profiles/work/workstreams.md
      - profiles/work/last_week.md
      - profiles/work/all_time.md
      - profiles/work/learned.md  # learned on team calls (each mode keeps its own)
  sbir:
    # SBIR/STTR consulting calls: referral partners (state programs, SBDCs, I-Corps hubs, firms)
    # and founders/PIs. Mostly 1-on-1, so every question gets an answer.
    trigger: auto
    context:
      - profiles/me.md
      - profiles/voice.md
      - profiles/sbir/              # intro, offer, proof, faq, contacts, prep, learned (see its README)
    # Read last, after all the context, so a long contacts file can't push it out of attention.
    rules: profiles/sbir/rules.md

  trainer:
    # Trainer mode (coding-interview practice). Answers here are about the coding problem; this
    # context is only for how you talk. `auto` answers every interviewer question in the Answers window.
    trigger: auto
    context:
      - profiles/me.md
      - profiles/voice.md

# Trainer mode: coding-interview rounds. Pick it on the start screen (or tray → Trainer…).
trainer:
  language: python            # the default in the setup dialog (any language in the list)
  folder: ""                  # where new solution files go; empty = Documents\Cue Trainer
  editor: code                # opens your solution file; "" = don't open anything
  timer_autostart: true       # the countdown starts as soon as the problem is clear enough to solve
  auto_run: true              # run the tests every time you save (runnable languages)
  models:                     # Claude models per job (claude CLI aliases)
    default: sonnet
    listener: sonnet          # keeps the requirements / questions board (runs a lot: haiku is lighter on usage)
    reviewer: sonnet          # reads your code as you type
  thinking_tokens: 6000       # the Designer, Test author and Debugger think first (their work is checked by running it)
  listen_every_s: 4           # at most one board update per this many seconds while people talk
  review_every_s: 8           # at most one code review per this many seconds while you type
  test_timeout_s: 5           # per test
  stress_timeout_s: 10        # the big-input speed test
  memory_mb: 1024             # per test run
  verify_count: 300           # random inputs the reference and brute force must agree on
  shrink_budget: 60           # runs spent finding the smallest failing input when you debug
  hotkeys:                    # Tab indents code, so trainer mode uses these instead of Tab / Shift+Tab
    answer: ctrl+alt+a        # double-press = full script
    explain: ctrl+alt+s
    narrate: ctrl+alt+n       # what to say out loud right now
    run_tests: ctrl+alt+r
    debug: ctrl+alt+d
    windows: ctrl+alt+w       # show / hide the trainer windows

# Documents you add (tray → Add documents…, drag files onto the panel, or cue-cli docs add):
# PDFs, Word (.docx) and text. They live in profiles/docs/ (every call) or profiles/docs/<mode>/.
docs:
  whole_chars: 120000         # documents up to this much text (in total) go to the model whole
  excerpt_chars: 5000         # bigger ones are searched: this much of the best-matching passages per question

hotkeys:
  # "someone just asked me something" — works in every trigger mode. The key still reaches
  # your other apps (Tab in a chat box still works); alt+tab / ctrl+tab don't trigger it.
  answer: tab                 # double-tap Tab = the same answer as a full script
  explain: shift+tab          # "what did they just say?" (plain-English rewrite of the last speaker)
  toggle_mode: ctrl+alt+m     # interview -> work -> sbir
  cycle_trigger: ctrl+alt+t   # auto -> smart -> name -> manual
  hide: ctrl+alt+h            # dismiss / bring back the last answer
  quit: ctrl+alt+q

audio:
  loopback_device: default    # "default" or part of an output device name (what you hear)
  mic_device: default         # "default" or part of an input device name
  # If you use speakers instead of headphones, your mic also hears the other side.
  # This ignores mic speech that overlaps with system audio so it isn't mistaken for you.
  echo_guard: true

stt:
  # large-v3-turbo: near large-v3 accuracy on accented English at ~medium speed on a 3060.
  # Fallbacks: medium (faster), large-v3 (most accurate, slowest).
  model: large-v3-turbo
  device: cuda
  compute_type: float16
  # Locking to English is deliberate: on short clips, auto-detect often decides a
  # Russian/Hungarian/Asian-accented speaker is speaking that language and transcribes
  # (or translates) wrong. Set to null to re-enable auto-detect.
  language: en
  beam_size: 5                # wider search = better on hard accents (~0.1s slower per utterance)
  transcribe_mic: true        # transcribe you too, so the model knows what you've already said
  utterance_silence_s: 0.6    # pause that ends someone's utterance (also the auto-trigger delay)
  max_utterance_s: 15         # force-cut very long monologues so the transcript stays live
  partial_every_s: 1.5        # live partial transcript cadence while someone is mid-sentence
  vad_aggressiveness: 2       # webrtcvad 0-3 for call audio; raise if noise counts as speech
  mic_vad_aggressiveness: 3   # your mic: strictest, so room noise isn't mistaken for you talking
  min_rms: 0.004              # quieter clips are skipped as noise (raise if keyboard/fan still gets transcribed)
  # Hard-to-understand speakers: once you've named them in the transcript pane, list them here and
  # their speech is transcribed with the slower, more accurate model below (other people stay fast).
  accurate_speakers: []       # e.g. [Sam]
  accurate_model: large-v3
  # Voice fingerprints: tell your own voice apart from people in the room, and tell call
  # participants apart ("who said what"). Set up your voice from the start screen.
  speaker_id: true
  voice_match: 0.6             # voice similarity needed to count as the same person (raise if people get merged)
  # How sure it must be that speech on YOUR mic is you (else it's "someone in the room").
  # Empty = voice_match - 0.05. Lower it (e.g. 0.35) if your own lines show up as "In room",
  # which happens with a mic that's far away, like a webcam's.
  me_match:
  # Extra words to bias Whisper toward (teammate names, jargon). profiles/work/glossary.txt
  # (generated by the worklog job) is added automatically.
  vocabulary: []              # e.g. [Priya Shah, Kubernetes, ProjectX, SLO]

transcript:
  buffer_s: 300               # how much conversation the model sees (Ollama gets the last 120s)

llm:
  # auto -> anthropic (if ANTHROPIC_API_KEY is set) -> claude_cli (your Claude subscription)
  #      -> ollama (fully local / offline)
  backend: auto
  claude_cli_model: sonnet    # sonnet = best answers, ~1.3 s to first word; haiku = ~0.9 s and lighter on usage
  anthropic_model: claude-haiku-4-5
  ollama_model: qwen2.5:7b    # local fallback + live notes; follows the answer format far better than llama3.1
  ollama_url: http://localhost:11434
  max_tokens: 260
  first_token_timeout_s: 8    # no first word from Claude by then -> re-ask the local model
  ollama_context_chars: 24000 # small local models get slow with huge prompts; context is trimmed to this

overlay:
  screen: 0                   # first-launch monitor (0 = primary); after that it stays where you drag it
  width: 760
  margin: 14
  font_size: 16
  acrylic: true               # native Windows frosted-glass blur behind the panel
  tint: "#141821"
  tint_alpha: 150             # 0-255 darkness of the glass
  hide_from_screen_share: true   # overlay is invisible to Teams/Zoom/OBS screen capture
  show_in_taskbar: true       # a taskbar button with the Cue icon (false = tray only)
  user_speech_min_s: 0.6      # you must talk this long before the fade logic arms
  fade_after_user_silence_s: 2.5
  max_visible_s: 120          # safety: fade even if you never answered
  fade_ms: 900

# Live call notes: key points, decisions, action items — whether or not anyone's talking to you.
# Running notes go to meetings/<date_time>.md during the call; a polished version is written
# when you end the call (red dot / tray / ctrl+alt+q). The transcript stays local in data/calls/.
notes:
  enabled: true
  update_every_s: 90          # fold new transcript into the notes this often...
  min_new_words: 60           # ...once at least this much new was said
  min_call_words: 150         # shorter "calls" (tests, false starts) don't get a notes file
  live_backend: auto          # auto = the local model (saves your Claude usage for answers), Claude if there's no local one | claude_first | claude | local
  live_model: haiku           # Claude model if the local one is unavailable
  final_model: sonnet
  # Accurate pass: the other side's audio is saved during the call, re-transcribed after it with
  # the big model and full context, and speakers are matched across the whole call; the final
  # notes are written from that. The audio is deleted as soon as the notes exist.
  accurate_pass: true
  accurate_model: large-v3
  # After each call, compare what was suggested with what you actually said and update
  # profiles/voice.md (how you talk) + profiles/<mode>/learned.md (facts, what you use/ignore,
  # kept per kind of call so a team call never brings up job hunting or SBIR pricing).
  # Previous versions are kept in data/learn_history/.
  learn: true
  learn_min_words: 40         # need at least this much of your own speech to learn from

# Work-history pipeline (python -m worklog). Reads your Claude Code + Cowork chats and git
# history, writes profiles/work/last_week.md, all_time.md and glossary.txt.
worklog:
  since: 2026-01-01           # how far back --backfill (and the very first run) goes
  work_projects: [my-main-repo]   # repo folder name(s) of your actual job; everything else is a side project
  background_files:           # context the summarizer should trust
    - profiles/me.md
    - profiles/work/notes.md
    - profiles/voice.md         # so "how I'd answer" in the brief sounds like you
    - profiles/work/learned.md
  daily_model: haiku          # one call per active day — haiku keeps backfills light on usage limits
  model: sonnet               # weekly summaries + the two main docs
  parallel: 2                 # concurrent claude -p calls during backfill

# SBIR mode: import your pipeline spreadsheets into profiles/sbir/contacts.md (read-only, the
# files are never written). Empty = off. Runs at the end of the daily job, or: cue-cli sbir-sync
sbir:
  tracker_dir: ""             # e.g. C:\Users\you\Desktop\SBIR
  tracker_files: []           # only these .xlsx in that folder; wildcards OK, e.g. LEADS_batch_*.xlsx (empty = all)
